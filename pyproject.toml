[project]
name = "lethe"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "sentry-sdk[fastapi]>=2.71.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Apple-Silicon only: Gemma 4 / LoRA experiments (experiments/real_smoke). Install with: uv sync --extra mlx
mlx = ["mlx-lm>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
